<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Refresh TPL app cache</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050505;
        color: #f4efe4;
        font-family: system-ui, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <p id="status">Clearing old app cache…</p>
    <script>
      (async function () {
        var status = document.getElementById('status');
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              regs.map(function (reg) {
                return reg.unregister();
              }),
            );
            status.textContent =
              'Removed ' + regs.length + ' service worker(s). Clearing caches…';
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(
              keys.map(function (key) {
                return caches.delete(key);
              }),
            );
          }
          status.textContent = 'Done. Opening pairing page…';
          window.location.replace(
            '/employee-device-pairing?fresh=' + Date.now(),
          );
        } catch (error) {
          status.textContent =
            'Clear failed: ' +
            (error && error.message ? error.message : String(error)) +
            '. Use Chrome → Site settings → Clear & reset, then reopen the app.';
        }
      })();
    </script>
  </body>
</html>
